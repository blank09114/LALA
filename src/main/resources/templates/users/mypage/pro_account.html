<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>계정관리</title>
    <th:block th:replace="~{shared/header :: headerScript}"></th:block>
    <link rel="stylesheet" th:href="@{/css/shared/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/users/pro_account.css}"/>
    <link rel="stylesheet" th:href="@{/css/shared/footer.css}"/>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header th:replace="~{shared/header :: header}"></header>
<div class="wrap">
    <!--사이드 메뉴바-->
    <div th:replace="~{users/mypage/sidebar :: sidebar(mypageUserData=${mypageUserData}, currentMenu='pro_account')}"></div>

    <main class="main-content">
        <h2>프로필 관리</h2>
        <div class="menu">
            <ul>
                <li>기본 정보</li>
                <li>외부 링크</li>
                <li>소개</li>
            </ul>
        </div>

        <section class="content">
            <!-- ✅ 기본 정보 -->
            <h3>기본 정보</h3>
            <div class="info" id="info-view">
                <div class="profile" id="profile-image"
                     th:style="'background-image: url(' +
                               (${mypageUserData.User.profileName != null} ?
                                ${mypageUserData.User.profileName} :
                                '/img/profileImg.png') + ');'"></div>
                <p class="name" id="display-nickname">로딩 중...</p>
                <button class="edit-btn" onclick="toggleEdit('info', true)">수정</button>
            </div>

            <div class="info" id="info-edit" style="display: none;">
                <div class="profile-edit">
                    <div class="profile" id="edit-profile-image">
                        <input type="file" id="profile-file-input" accept="image/*" style="display: none;"
                               onchange="handleProfileImageUpload(event)">
                        <button class="edit-icon" onclick="document.getElementById('profile-file-input').click()"><i class="fa-solid fa-image"></i></button>
                    </div>
                </div>
                <label class="label">닉네임</label>
                <input type="text" class="name-input" id="nickname-input"/>
                <div class="button">
                    <button class="cancel-btn" onclick="toggleEdit('info', false)">취소</button>
                    <button class="save-btn" onclick="saveBasicInfo()">저장</button>
                </div>
            </div>

            <!-- ✅ 외부 링크 -->
            <h3>외부 링크</h3>
            <div class="link" id="link-view">
                <div id="external-links-display">
                    <p>로딩 중...</p>
                </div>
                <button class="edit-btn" onclick="toggleEdit('link', true)">수정</button>
            </div>

            <div class="link" id="link-edit" style="display: none;">
                <div id="external-links-edit">
                    <!-- 동적으로 생성될 링크 입력 필드들 -->
                </div>
                <button type="button" onclick="addLinkInput()" class="save-btn">+ 링크 추가</button>
                <div class="button">
                    <button class="cancel-btn" onclick="toggleEdit('link', false)">취소</button>
                    <button class="save-btn" onclick="saveExternalLinks()">저장</button>
                </div>
            </div>

            <!-- ✅ 소개 -->
            <h3>소개</h3>
            <div class="intro" id="intro-view">
                <p id="intro-content-display">로딩 중...</p>
                <button class="edit-btn" onclick="toggleEdit('intro', true)">수정</button>
            </div>

            <div class="intro" id="intro-edit" style="display: none;">
                <textarea rows="8" id="intro-textarea" placeholder="소개를 입력해주세요."></textarea>
                <div class="button">
                    <button class="cancel-btn" onclick="toggleEdit('intro', false)">취소</button>
                    <button class="save-btn" onclick="saveIntroduction()">저장</button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 이미지 크롭 모달 -->
<div class="crop-modal" id="crop-modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>프로필 사진 편집</h3>
            <button class="close-btn" onclick="closeCropModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="crop-container">
                <img id="crop-image" alt="크롭할 이미지">
            </div>
        </div>
        <div class="modal-footer">
            <button class="cancel-btn" onclick="closeCropModal()">취소</button>
            <button class="save-btn" onclick="applyCropPreview()">적용</button>
        </div>
    </div>
</div>
<footer th:replace="~{shared/footer :: footer}"></footer>
<!-- Cropper.js 스크립트 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

<!-- ✅ 스크립트 -->
<script>
    // 전역 변수로 현재 데이터 저장
    let currentData = {};
    let cropper = null;
    let selectedFile = null;
    let previewImageBlob = null; // 미리보기 이미지 blob 저장
    let hasImageChanged = false; // 이미지 변경 여부 확인

    // 페이지 로드 시 데이터 가져오기
    document.addEventListener('DOMContentLoaded', function () {
        loadInformationProviderData();
    });

    // API에서 지식제공자 정보 가져오기
    async function loadInformationProviderData() {
        try {
            const response = await fetch('/users/mypage/information-provider');
            if (!response.ok) {
                throw new Error('데이터를 불러오는데 실패했습니다.');
            }

            currentData = await response.json();

            // 화면에 데이터 표시
            displayData(currentData);
        } catch (error) {
            console.error('데이터 로드 실패:', error);
            alert('데이터를 불러오는데 실패했습니다.');
        }
    }

    // 데이터를 화면에 표시하는 함수
    function displayData(data) {
        // 기본 정보 표시
        displayBasicInfo(data);

        // 외부 링크 표시
        displayExternalLinks(data);

        // 소개 표시
        displayIntroduction(data);
    }

    /**
     * 캐시 무효화를 위한 이미지 URL 생성 함수
     * @param {string} imageUrl - 원본 이미지 URL
     * @returns {string} - 캐시 무효화 처리된 이미지 URL
     */
    function getCacheBustedImageUrl(imageUrl) {
        if (!imageUrl) return null;

        // blob: URL이나 data: URL인 경우 그대로 반환
        if (imageUrl.startsWith('blob:') || imageUrl.startsWith('data:')) {
            return imageUrl;
        }

        // 기본 이미지인 경우 그대로 반환
        if (imageUrl.includes('/img/profileImg.png')) {
            return imageUrl;
        }

        // 외부 이미지 URL에 타임스탬프 추가
        const separator = imageUrl.includes('?') ? '&' : '?';
        return `${imageUrl}${separator}t=${Date.now()}`;
    }

    // 기본 정보 표시
    function displayBasicInfo(data) {
        const profileImage = document.getElementById('profile-image');
        const editProfileImage = document.getElementById('edit-profile-image');
        const displayNickname = document.getElementById('display-nickname');
        const nicknameInput = document.getElementById('nickname-input');

        // 프로필 이미지 설정 (캐시 무효화 적용)
        if (data.profileURL) {
            const cacheBustedUrl = getCacheBustedImageUrl(data.profileURL);
            const backgroundImage = `url('${cacheBustedUrl}')`;
            profileImage.style.backgroundImage = backgroundImage;
            editProfileImage.style.backgroundImage = backgroundImage;
        } else {
            // 기본 이미지 설정
            profileImage.style.backgroundImage = 'url("/img/profileImg.png")';
            editProfileImage.style.backgroundImage = 'url("/img/profileImg.png")';
        }

        // 닉네임 설정
        const nickname = data.nickname || '닉네임을 입력해주세요';
        displayNickname.textContent = nickname;
        nicknameInput.value = data.nickname || '';
    }

    // 외부 링크 표시
    function displayExternalLinks(data) {
        const linksDisplay = document.getElementById('external-links-display');
        const linksEdit = document.getElementById('external-links-edit');

        if (data.externalLink && data.externalLink.trim() !== '') {
            // 세미콜론(;) 또는 줄바꿈(\n)으로 분리된 링크들을 배열로 변환
            const links = data.externalLink
                .split(/[;\n]/)  // 세미콜론 또는 줄바꿈으로 분리
                .map(link => link.trim())  // 각 링크의 앞뒤 공백 제거
                .filter(link => link !== '');  // 빈 문자열 제거

            if (links.length > 0) {
                // 보기 모드
                linksDisplay.innerHTML = links.map(link =>
                    `<p><a href="${link}" target="_blank">${link}</a></p>`
                ).join('');

                // 편집 모드
                linksEdit.innerHTML = links.map((link, index) =>
                    `<div class="link-item">
                        <input type="text" class="link-input" value="${link}" data-index="${index}" />
                        <button type="button" onclick="removeLinkInput(this)" class="remove-btn">x</button>
                    </div>`
                ).join('');
            } else {
                displayEmptyLinks();
            }
        } else {
            displayEmptyLinks();
        }

        function displayEmptyLinks() {
            linksDisplay.innerHTML = '<p>외부 링크를 추가해주세요.</p>';
            linksEdit.innerHTML = `
                <div class="link-item">
                    <input type="text" class="link-input" placeholder="외부 링크를 입력해주세요" data-index="0" />
                    <button type="button" onclick="removeLinkInput(this)" class="remove-btn">x</button>
                </div>`;
        }
    }

    // 소개 표시
    function displayIntroduction(data) {
        const introDisplay = document.getElementById('intro-content-display');
        const introTextarea = document.getElementById('intro-textarea');

        const introduction = data.infoContent || '소개를 입력해주세요.';

        // 보기 모드 (줄바꿈을 <br>로 변환)
        introDisplay.innerHTML = introduction.replace(/\n/g, '<br />');

        // 편집 모드
        introTextarea.value = data.infoContent || '';
    }

    // 프로필 이미지 업로드 처리
    function handleProfileImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 파일 타입 검증
        if (!file.type.startsWith('image/')) {
            alert('이미지 파일만 업로드할 수 있습니다.');
            return;
        }

        // 파일 크기 검증 (5MB)
        if (file.size > 5 * 1024 * 1024) {
            alert('파일 크기는 5MB를 초과할 수 없습니다.');
            return;
        }

        selectedFile = file;

        // 파일을 읽어서 크롭 모달에 표시
        const reader = new FileReader();
        reader.onload = function (e) {
            const cropImage = document.getElementById('crop-image');
            cropImage.src = e.target.result;
            openCropModal();
        };
        reader.readAsDataURL(file);
    }

    // 크롭 모달 열기
    function openCropModal() {
        const modal = document.getElementById('crop-modal');
        const cropImage = document.getElementById('crop-image');

        modal.style.display = 'flex';

        // 이미지가 로드된 후 Cropper 초기화
        cropImage.onload = function () {
            if (cropper) {
                cropper.destroy();
            }

            cropper = new Cropper(cropImage, {
                aspectRatio: 1, // 정사각형 비율
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 1,
                responsive: true,
                cropBoxResizable: true,
                cropBoxMovable: true,
                minCropBoxWidth: 100,
                minCropBoxHeight: 100,
                ready: function () {
                    // 크롭 영역을 중앙에 배치
                    this.cropper.crop();
                }
            });
        };
    }

    // 크롭 모달 닫기
    function closeCropModal() {
        const modal = document.getElementById('crop-modal');
        modal.style.display = 'none';

        if (cropper) {
            cropper.destroy();
            cropper = null;
        }

        // 파일 input 초기화
        document.getElementById('profile-file-input').value = '';
    }

    // 크롭 적용 (미리보기만) - 알림창 제거
    function applyCropPreview() {
        if (!cropper) return;

        try {
            // 크롭된 이미지를 Canvas로 변환
            const canvas = cropper.getCroppedCanvas({
                width: 300,
                height: 300,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            // Canvas를 Blob으로 변환
            canvas.toBlob(function (blob) {
                if (!blob) {
                    alert('이미지 처리에 실패했습니다.');
                    return;
                }

                // 미리보기 이미지 저장
                previewImageBlob = blob;
                hasImageChanged = true;

                // 이전 blob URL이 있다면 메모리 해제
                const editProfileImage = document.getElementById('edit-profile-image');
                const currentBgImage = editProfileImage.style.backgroundImage;
                if (currentBgImage && currentBgImage.includes('blob:')) {
                    const urlMatch = currentBgImage.match(/url\("?(.*?)"?\)/);
                    if (urlMatch && urlMatch[1].startsWith('blob:')) {
                        URL.revokeObjectURL(urlMatch[1]);
                    }
                }

                // 미리보기 이미지 표시
                const imageUrl = URL.createObjectURL(blob);
                editProfileImage.style.backgroundImage = `url('${imageUrl}')`;

                // 크롭 모달 닫기
                closeCropModal();

                // 알림창 제거 - 이 부분을 삭제했습니다
            }, 'image/jpeg', 0.9);
        } catch (error) {
            console.error('이미지 처리 실패:', error);
            alert('이미지 처리에 실패했습니다.');
        }
    }

    // 이미지 미리보기 제거 - 함수는 유지하되 버튼은 제거
    function removeImagePreview() {
        // 이전 blob URL 메모리 해제
        const editProfileImage = document.getElementById('edit-profile-image');
        const currentBgImage = editProfileImage.style.backgroundImage;
        if (currentBgImage && currentBgImage.includes('blob:')) {
            const urlMatch = currentBgImage.match(/url\("?(.*?)"?\)/);
            if (urlMatch && urlMatch[1].startsWith('blob:')) {
                URL.revokeObjectURL(urlMatch[1]);
            }
        }

        previewImageBlob = null;
        hasImageChanged = false;

        // 원래 이미지로 되돌리기 (캐시 무효화 적용)
        if (currentData.profileURL) {
            const cacheBustedUrl = getCacheBustedImageUrl(currentData.profileURL);
            editProfileImage.style.backgroundImage = `url('${cacheBustedUrl}')`;
        } else {
            editProfileImage.style.backgroundImage = 'url("/img/profileImg.png")';
        }

        // 파일 input 초기화
        document.getElementById('profile-file-input').value = '';
    }

    // 편집 모드 토글
    function toggleEdit(section, isEdit) {
        const viewId = section + '-view';
        const editId = section + '-edit';

        if (isEdit) {
            document.getElementById(viewId).style.display = 'none';
            document.getElementById(editId).style.display = 'block';
        } else {
            document.getElementById(viewId).style.display = 'block';
            document.getElementById(editId).style.display = 'none';

            // 편집 모드를 취소할 때 미리보기 제거
            if (section === 'info') {
                removeImagePreview();
            }
        }
    }

    // 기본 정보 저장 (닉네임 + 프로필 이미지)
    async function saveBasicInfo() {
        const nickname = document.getElementById('nickname-input').value.trim();

        if (!nickname) {
            alert('닉네임을 입력해주세요.');
            return;
        }

        try {
            // 프로필 이미지가 변경되었다면 먼저 업로드
            if (hasImageChanged && previewImageBlob) {
                await uploadProfileImage();
            }

            // 닉네임 저장
            await saveNickname(nickname);

            alert('기본 정보가 성공적으로 저장되었습니다.');

            // 편집 모드 종료
            toggleEdit('info', false);

            // 미리보기 상태 초기화
            previewImageBlob = null;
            hasImageChanged = false;

            // 페이지 새로고침 없이 최신 데이터 다시 로드
            await loadInformationProviderData();

        } catch (error) {
            console.error('기본 정보 저장 실패:', error);
            alert('기본 정보 저장에 실패했습니다: ' + error.message);
        }
    }

    // 프로필 이미지 업로드
    async function uploadProfileImage() {
        if (!previewImageBlob) {
            throw new Error('업로드할 이미지가 없습니다.');
        }

        // FormData 생성
        const formData = new FormData();
        formData.append('file', previewImageBlob, 'profile.jpg');

        const response = await fetch('/users/mypage/profile-image', {
            method: 'POST',
            body: formData,
            // 캐시 방지 헤더 추가
            headers: {
                'Cache-Control': 'no-cache',
                'Pragma': 'no-cache'
            }
        });

        if (!response.ok) {
            throw new Error('이미지 업로드에 실패했습니다.');
        }

        const result = await response.json();

        if (result.status === 'success') {
            // 새로운 이미지 URL로 업데이트 (캐시 무효화 적용)
            currentData.profileURL = result.imageUrl;
        } else {
            throw new Error(result.message || '이미지 업로드에 실패했습니다.');
        }
    }

    // 닉네임 저장
    async function saveNickname(nickname) {
        const response = await fetch('/users/mypage/nickname', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache',
                'Pragma': 'no-cache'
            },
            body: JSON.stringify({nickname: nickname})
        });

        if (!response.ok) {
            throw new Error('닉네임 업데이트에 실패했습니다.');
        }

        const result = await response.json();

        if (result.status === 'success') {
            currentData.nickname = nickname;
        } else {
            throw new Error(result.message || '닉네임 업데이트에 실패했습니다.');
        }
    }

    // 외부 링크 추가
    function addLinkInput() {
        const linksEdit = document.getElementById('external-links-edit');
        const linkItems = linksEdit.querySelectorAll('.link-item');
        const newIndex = linkItems.length;

        const newLinkDiv = document.createElement('div');
        newLinkDiv.className = 'link-item';
        newLinkDiv.innerHTML = `
            <input type="text" class="link-input" placeholder="외부 링크를 입력해주세요" data-index="${newIndex}" />
            <button type="button" onclick="removeLinkInput(this)" class="remove-btn">삭제</button>
        `;

        linksEdit.appendChild(newLinkDiv);
    }

    // 외부 링크 제거
    function removeLinkInput(button) {
        const linkItem = button.parentElement;
        linkItem.remove();
    }

    // 외부 링크 저장
    async function saveExternalLinks() {
        const linkInputs = document.querySelectorAll('.link-input');
        const links = Array.from(linkInputs)
            .map(input => input.value.trim())
            .filter(link => link !== '');

        const externalLink = links.join(';');

        try {

            const response = await fetch('/users/mypage/external-links', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({externalLink: externalLink})
            });

            if (response.ok) {
                const result = await response.json();

                currentData.externalLink = externalLink;
                displayExternalLinks(currentData);
                toggleEdit('link', false);
                alert('외부 링크가 성공적으로 업데이트되었습니다.');
            } else {
                const errorResponse = await response.json();
                console.error('에러 응답:', errorResponse); // 디버깅 로그 추가
                throw new Error(errorResponse.message || '외부 링크 업데이트에 실패했습니다.');
            }
        } catch (error) {
            console.error('외부 링크 저장 실패:', error);
            alert('외부 링크 저장에 실패했습니다: ' + error.message);
        }
    }

    // 소개 저장
    async function saveIntroduction() {
        const introduction = document.getElementById('intro-textarea').value.trim();

        try {
            const response = await fetch('/users/mypage/introduction', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({introduction: introduction})
            });

            if (response.ok) {
                currentData.infoContent = introduction;
                displayIntroduction(currentData);
                toggleEdit('intro', false);
                alert('소개가 성공적으로 업데이트되었습니다.');
            } else {
                throw new Error('소개 업데이트에 실패했습니다.');
            }
        } catch (error) {
            console.error('소개 저장 실패:', error);
            alert('소개 저장에 실패했습니다.');
        }
    }
</script>

<style>
    /* 크롭 모달 스타일 */
    .crop-modal {
        display: none;
        position: fixed;
        z-index: 1000;
