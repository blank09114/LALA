<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
          margin: 0;
          padding: 0;
<!--          background-color: #f9f9f9;-->
          font-family: 'Noto Sans KR', sans-serif;
        }

        .findPassword-container{
        margin: 0 auto;
        padding: 80px 16px;
        align-items: center;
        font-family: 'Noto Sans KR', sans-serif;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 10px;
}

        .passwordTitle {
          text-align: center;
          margin-top: 60px;
          margin-bottom: 30px;
        }

        .emailForm {
          max-width: 480px;
          margin: 0 auto;
          background-color: #fff;
          padding: 32px 24px;
          border-radius: 12px;
          box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .emailForm label {
          font-size: 15px;
          margin-bottom: 4px;
          color: #444;
        }

        .emailForm input[type="email"] {
          height: 44px;
          padding: 0 12px;
          font-size: 14px;
          border: 1px solid #ccc;
          border-radius: 6px;
          box-sizing: border-box;
        }

        #send-code-button {
          height: 44px;
          background-color: #00B37E;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 15px;
          cursor: pointer;
          transition: background-color 0.2s;
        }

        #send-code-button:hover {
          background-color: #009b6a;
        }

        .error {
          font-size: 13px;
          color: red;
        }

        .loginBack{
            font-size: 15px;
            text-decoration : none;
            color: #444;
        }
    </style>

</head>
<body>

<div class="findPassword-container">
<div class="passwordTitle">
   <a th:href="@{/auth/login}"> <img th:src="@{/img/LALA_log.png}" alt="LALA 로고" class="logo" /></a>
<h1>비밀번호 찾기</h1>
</div>

<form class="emailForm">
<label for="email">가입 이메일</label>
<input type="email" id="email" name="email" >
<button type="button" id="send-code-button">임시 비밀번호 발송</button>

    <a th:href="@{/auth/login}" class="loginBack"> 돌아가기 </a>
<span id="emailCheckMessage" class="error"></span>

<!--    <div id="verifyCodeSection">-->
<!--        <label for="temporaryPassword">임시 비밀번호</label>-->
<!--        <input type="text" id="temporaryPassword" name="temporaryPassword" placeholder="임시 비밀번호 입력" required />-->
<!--        <button type="button" id="verify-temporary-password-button">임시 비밀번호 확인</button>-->
<!--        <span id="verificationMessage" class="error"></span>-->
<!--    </div>-->

</form>
</div>
<script>
    $(document).ready(function() {
        $('#send-code-button').on('click', function() {
            let email = $('#email').val();
            $.ajax({
                url: '/auth/check-email',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ mail: email }),
                success: function(response) {
                    if (response) {
                        $.ajax({
                            url: '/auth/reset-password',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({ mail: email }),
                            success: function(response) {
                                alert('임시 비밀번호가 이메일로 발송되었습니다. 이메일을 확인해주세요.');
                                 window.location.href = '/auth/login';
                            },
                            error: function(error) {
                                alert('임시 비밀번호 발송에 실패했습니다. 다시 시도해주세요.');
                            }
                        });
                    }
                }
            });
        });
    });
</script>

</body>
</html>
