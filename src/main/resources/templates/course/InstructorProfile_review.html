<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강사소개 수강평</title>
    <link rel="stylesheet" th:href="@{/css/shared/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/course/InstructorProfile_review.css}"/>
    <link rel="stylesheet" th:href="@{/css/shared/footer.css}" />

</head>
<body>

<!--헤더 시작-->
<header class="header">
    <div class="header_left">
        <a th:href="@{/course/main}">
            <img src="/img/LALA_log.png" alt="LALA 로고" class="header_logo">
        </a>
        <!--커뮤니티 컨트롤러는 어디에-->
        <a th:href="@{/auth/community/board}">
            <div class="header_nav">커뮤니티</div>
        </a>
        <div class="header_nav">
            <a class="header_nav" th:href="@{/course/main}">강의</a>
        </div>
    </div>

    <!--검색하는곳-->
    <div class="header_search">
        <input type="text" id="searchInput" class="search_input" placeholder="듣고싶은 강의를 찾아보세요">
        <button class="search_btn" onclick="performSearch()">
            <img src="/img/search.png" alt="검색이미지">
        </button>
        <div id="searchSuggestions" class="search-suggestions"></div>
    </div>

    <div class="header_actions">
        <a th:href="@{/course/letsgoLMS}">
            <button class="play_btn"><img src="/img/play.png" alt="재생이미지"></button>
        </a>
        <a th:href="@{/mypage/main}">
            <div class="profile_btn">프로필</div>
        </a>
    </div>
</header>
<!--헤더 끝-->

<div class="InstructorProfile_wrap">

    <div class="InstructorProfile_left">

        <!-- 프로필 시작 -->
        <div class="profile">
            <div class="profile_img">
                <img id="profileImage" src="/img/profileImg.png" alt="프로필 이미지">
                <h3 id="nickname" th:text="${providerId}" >이게 나오면 안돼</h3>
            </div>

            <div class="profile_info">
                <div class="user_cnt">
                    <div class="title" >수강생</div>
                    <div class="value"  id="studentNum" th:text="${providerId}">9,826</div>
                </div>
                <div class="user_review">
                    <div class="title">수강평수</div>
                    <div class="value"  id="reviewNum" th:text="${providerId}">869</div>
                </div>
                <div class="user_star">
                    <div class="title">강의평점</div>
                    <div class="title_star">
                        <div>⭐</div>
                        <div class="value"  id="reviewAvg" th:text="${providerId}">이게 나오면 안돼</div>
                    </div>
                </div>
            </div>

            <div class="profile_fav">
                <button class="fav_button" onclick="showToastFav()">찜하기</button>
            </div>

            <!-- 토스트 알림용 div -->
            <div id="toast" style="
              visibility: hidden;
              min-width: 250px;
              background-color: #333;
              color: #fff;
              text-align: center;
              border-radius: 4px;
              padding: 12px;
              position: fixed;
              z-index: 999;
              bottom: 30px;
              left: 50%;
              transform: translateX(-50%);
              font-size: 14px;
              transition: visibility 0s, opacity 0.5s linear;
              opacity: 0;
            "></div>


            <div class="profile_site">
                <img src="/img/tistoryImg.png" alt="tistory 이미지"><a href="https://www.tistory.com" id="externalLink1" th:text="${providerId}" >관련 링크 이동</a><br>
                <img src="/img/blogImg.png" alt="블로그 이미지"><a href="https://www.naver.com" id="externalLink2" th:text="${providerId}">관련 링크 이동</a>
            </div>
        </div>
        <!-- 프로필 끝 -->

        <!-- 소개 시작 -->
        <div class="introduction">
            <h2>소개</h2>
            <p id="infoContent" th:text="${providerId}">
                안녕하세요<br>수경닷컴 『너네가 코딩을 알아?』저자 박수경입니다.<br>
        </div>
        <!-- 소개 끝 -->


        <!-- 카테고리 시작 -->
        <div class="category">
            <a th:href="@{/course/IPdetail/{providerId}(providerId=${providerId})}" class="menu active">강의</a>
            <a th:href="@{/course/IPdetail/{providerId}/review(providerId=${providerId})}" class="menu">수강평</a>
        </div>
        <!-- 카테고리 끝 -->

    </div>


    <!-- 강의 수강평 시작 -->
    <section class="course">

        <div class="review-header-container">
            <h2 class="review-title">수강평</h2>
            <span class="total-count">전체<span class="total-number">3</span></span>
        </div>


        <div class="review-list">
            <div class="review1">
                <div class="thumbnail"><img src="/img/b3b9f2a1-2bb3-429a-be5e-31945a603018.jpg" alt="수강평 썸네일"></div>
                <div>
                    <div>
                        <div class="star">★★★★★</div>
                        <div class="nickname1" id="nickname1" th:text="${providerId}">수강생</div>
                        <div class="writeDate" id="writeDate" th:text="${providerId}">2025.06.01</div>
                    </div>
                    <div class="title" id="title" th:text="${providerId}">[LALA X 냥박사] 강의 1</div>
                </div>

            </div>
            <div class="review2">
                <div class="content" id="content" th:text="${providerId}">제가 너무 유익한 강의 1번이었습니다. 좋은 강의 해주셔서 감사합니다.</div>
            </div>
        </div>

        <div class="pagination" id="pagination">
            <button class="page-btn prev">&lt;</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">5</button>
            <button class="page-btn next">&gt;</button>
        </div>

    </section>
    <!-- 강의 수강평 끝 -->


</div>
<div id="providerId" data-provider-id="[[${providerId}]]"></div>
<footer th:replace="~{shared/footer :: footer}"></footer>
<script th:src="@{/js/course/InstructorProfile_review.js}" defer></script>
<script th:inline="javascript">
    // 컨트롤러에서 전달한 데이터를 전역 변수로 설정
    //attribute에서 저장한 값을 js로 보낸다고 생각하면 되는거임
    window.serverData = {
        providerId: /*[[${providerId}]]*/ 'null'
    };
</script>
</body>
</html>
