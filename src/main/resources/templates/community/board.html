<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>커뮤니티</title>
    <th:block th:replace="~{shared/header :: headerScript}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/community/board.css}"/>
    <link rel="stylesheet" th:href="@{/css/shared/header.css}" />
    <link rel="stylesheet" th:href="@{/css/shared/footer.css}"/>
</head>
<body>

<header th:replace="~{shared/header :: header}"></header>

<div class="wrap">
    <!-- 사이드 메뉴바 -->
    <aside class="sidebar-menu">
        <h2>커뮤니티</h2>
        <ul>
            <li><a href="#" onclick="loadPostsByCategory('free', this)" class="active">자유 게시판</a></li>
            <li><a href="#" onclick="loadPostsByCategory('study', this)">스터디 모집</a></li>
            <li><a href="#" onclick="loadPostsByCategory('qna', this)">질문 & 답변</a></li>
            <li><a href="#" onclick="loadPostsByCategory('notice', this)">공지 게시판</a></li>
        </ul>
    </aside>


    <!-- 본문 -->
    <main class="content">
        <!-- 검색창과 필터 -->
        <!-- 검색창과 필터 -->
        <div class="search-bar">
            <!-- 검색 결과 정보 (별도 영역) -->
            <div id="searchInfo"></div>

            <!-- 검색 입력 영역 (검색창, 드롭다운, 버튼이 같은 줄) -->
            <div class="search-input-area">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="18"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
                    </svg>
                    <input type="text" id="searchInputs" placeholder="원하는 내용을 검색해보세요!"/>
                </div>

                <div class="custom-dropdown">
                    <button class="dropdown-toggle">
                        <span class="label">선택</span>
                        <svg class="arrow" width="16" height="16" viewBox="0 0 24 24">
                            <path d="M7 10l5 5 5-5" fill="none" stroke="#666" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="dropdown-list">
                        <li class="selected">선택</li>
                        <li data-value="title">제목</li>
                        <li data-value="content">내용</li>
                        <li data-value="writer">작성자</li>
                    </ul>
                </div>

                <button class="search-btn" onclick="onSearch()">검색</button>
            </div>
        </div>

        <!-- 정렬 필터 -->
        <ul class="filter-options" id="orderList">
            <li data-order="latest" class="active">최신순</li>
            <li data-order="popular">조회순</li>
            <li data-order="comments">댓글순</li>
            <li data-order="likes">좋아요순</li>
            <li class="write-btn"><button onclick="location.href='/auth/community/boardWriter'">글쓰기</button></li>
        </ul>

        <!-- 게시글 목록 -->
        <ul class="post-list" id="postList"></ul>
        <div class="pagination"></div>
        <!-- 페이지네이션 (향후 기능 추가 가능) -->
        <!-- <div class="pagination">...</div> -->
    </main>
</div>

<footer th:replace="~{shared/footer :: footer}"></footer>


<script th:src="@{/js/community/board.js}" defer></script>

</body>
</html>
