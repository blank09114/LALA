<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <script type="text/javascript" src="/smarteditor/js/HuskyEZCreator.js" charset="utf-8">

  </script>
  <meta charset="UTF-8">
  <title>smart editor</title>
  <style>
    input{
      width:200px;
      height:200px;
    }
  </style>
</head>

<script>
  let oEditors = []

  smartEditor = function() {
    console.log("Naver SmartEditor")
    nhn.husky.EZCreator.createInIFrame({
      oAppRef: oEditors,
      elPlaceHolder: "editorTxt",
      sSkinURI: "/smarteditor/SmartEditor2Skin.html",
      fCreator: "createSEditor2"
    })
  }

  $(document).ready(function() {
    smartEditor()
  })
</script>

<script>
  submitPost = function() {
  oEditors.getById["editorTxt"].exec("UPDATE_CONTENTS_FIELD", [])
  let content = document.getElementById("editorTxt").value

  if(content == '') {
    alert("내용을 입력해주세요.")
    oEditors.getById["editorTxt"].exec("FOCUS")
    return
  } else {
    
  }
};
</script>
<body>
<h3>Naver Smart Editor 2.0</h3>
<form action="insertStudentInfoForm" method="post">
  <div id="smarteditor">
        <textarea name="editorTxt" id="editorTxt"
                  rows="20" cols="10"
                  placeholder="내용을 입력해주세요"
                  style="width: 500px"></textarea>
  </div>
  <input type="button" onclick="smartEditor()" value="생성">
  <input type="button" onclick="submitPost()" value="전송">
</form>
<script src="http://code.jquery.com/jquery-latest.js"></script>
</body>
</html>
